<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Security CTF{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="{{ url_for('index') }}" class="nav-brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-text">AI Under Attack</span>
        <span class="brand-sub">AI Security</span>
      </a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Challenges</a>
        <a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}active{% endif %}">About</a>
      </div>
      <div class="nav-score" id="nav-score" title="Your score">
        <span class="score-icon">🏆</span>
        <span id="score-value">0 pts</span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>AI Under Attack — AI Security Learning Platform</p>
      <p class="footer-sub">Built for COMP6441 · UNSW Sydney · 2024</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
